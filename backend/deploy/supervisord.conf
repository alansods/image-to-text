; Hugging Face Spaces: os três processos do backend num contêiner (design D2).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:redis]
; Sem persistência: nada da conversão sobrevive a um reinício.
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=celery -A app.worker worker -B --schedule=/tmp/celerybeat-schedule --loglevel=info --concurrency=1
directory=/srv
priority=20
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port 7860
directory=/srv
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
