[project]
name = "image-to-text-backend"
version = "0.1.0"
description = "API e worker do image-to-text: converte imagens e PDFs em documentos editáveis"
authors = [
    { name = "Alan Santos", email = "alansods@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "fastapi>=0.143.2",
    "opencv-contrib-python==4.10.0.84",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "fakeredis>=2.40.0",
    "httpx2>=2.13.1",
    "jiwer>=4.0.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Os documentos sintéticos usam de propósito caracteres que confundem (×, 1/l, 0/O) para testar o OCR.
"tests/fixtures/precision/generator/*" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Bibliotecas sem anotações de tipo publicadas.
module = ["reportlab.*", "pypdfium2.*", "paddleocr.*", "paddlex.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not precision'"
markers = [
    "precision: testes lentos de precisão contra gabaritos (rodar com -m precision)",
]
